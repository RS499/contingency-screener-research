  - id: R23
    rule: "No literature review or history of literature beyond the short introduction"
    source: "GUIDE2027 rule 8"
    status: confirmed
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rule 8"
    verbatim: >-
      "Do not include library research or a history of literature beyond the short introduction,
      detailed explanations of experiments and procedures of other researchers that preceded the
      project, lengthy autobiographical information or personal history."
    check: null
    note: >-
      DISTINCT FROM R16, which is about eligibility genre; this is about report structure. It
      independently justifies the decision already taken in notes/writing-guide.md 3.0 and 3.D
      to demote Related Work from a standalone section to an in-place rewrite of :86 inside the
      Introduction. A standalone Related Work section is what this rule discourages.

  - id: R24
    rule: "First person 'I' is permitted in place of 'we' to clarify independent work"
    source: "GUIDE2027 rule 7"
    status: confirmed
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rule 7"
    verbatim: >-
      "If it is widely accepted to write scientific journal articles in your specific subject
      area using first person plural 'we' then it is acceptable for a student to use the first
      person 'I' in place of 'we' in their Regeneron STS research report. This will help to
      clarify what was done independently vs. with support. If this is not widely accepted in
      your subject area, the passive voice should still be used."
    check: null
    note: >-
      DIRECTLY RELEVANT to notes/writing-guide.md PART 2 item 11 (voice: the abstract's first
      person against the body and Acknowledgments). Power-systems and ML venues use "we", so
      this rule PERMITS "I" and states the reason - clarifying independent work. On a
      sole-authored report the plural "the authors" at :287 is the anomaly, not the singular.

