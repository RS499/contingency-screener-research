# STS 2027 compliance constraints
#
# One row per Master Plan section 2 rule.
#
# EVERY ROW STARTS status: verify. Nothing here is marked confirmed without the 2027
# rules book. The corpus these came from spans the 2021-2024 cycles and the organizers
# state the rules change annually. A row marked confirmed on the strength of a 2023
# webinar is worse than a row marked verify, because the first stops anyone from checking.
#
# 2026-08-27: THE 2027 RULES BOOK WAS FETCHED. Rows checked against it below now carry
# rule_ref (rule number + page) and verbatim text. Rows that the fetched pages cannot
# settle STAY status: verify and name the page that would settle them. Reading pages 3-6
# and 33-35 of a 50-page book does not license confirming a row from the other 41 pages.
#
# status values:
#   verify        - not yet checked against the 2027 rules book. The only legal
#                   starting value.
#   confirmed     - checked against the 2027 rules book. date_checked REQUIRED.
#   corrected     - the row was answerable and WRONG or materially incomplete as
#                   recorded. superseded_text REQUIRED, plus the correct text with
#                   its citation. Added 2026-08-27.
#   contradicted  - the 2027 book says something different. note REQUIRED.
#   ask           - ambiguous in the corpus; needs a question to STS staff.
#   n/a           - does not apply to this project. note REQUIRED.
#
# scripts/check_compliance.py reads this file. Rows whose `check` field names a
# mechanical check are enforced; rows without one are advisory and are reported as
# MANUAL so they are never silently assumed satisfied.

