      EVADE THE LIMIT.

  - id: R06
    rule: "Font size at or above 10-11pt; students have been disqualified for cramming with tiny fonts"
    source: "corpus"
    status: corrected
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rule 5a"
    superseded_text: >-
      "Font size at or above 10-11pt" - the range was a corpus artefact. The 2027 floor is a
      single value, and it is expressed as an APPEARANCE test, not a declared point size.
    verbatim: >-
      "Choose a font that is legible and appropriate for a research paper. Research Reports found
      to use smaller than recommended font or margin size in order to increase word count may be
      disqualified. The font size should appear on the page at least as large as Times New Roman
      11pt font. Captions may be smaller if legible."
    check: font_floor
    note: >-
      Floor is 11pt-equivalent, not 10pt. Manuscript declares 12pt Times (newtxtext) and PASSES.
      Note the rule is about how the font APPEARS, so a declared point size is evidence, not
      proof. "Captions may be smaller if legible" is what makes the Appendix 3 citation lines
      affordable inside captions.

  - id: R07
    rule: "Single column, 1.5 line spacing, 1 inch margins, Times New Roman"
    source: "2027 guidelines"
    status: corrected
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rule 5b (with 5a for the font)"
    superseded_text: >-
      "Single column, 1.5 line spacing, 1 inch margins, Times New Roman" - the last item is
      WRONG. The 2027 book does NOT mandate Times New Roman. It mandates a size that APPEARS at
      least as large as TNR 11pt, which is a floor expressed in TNR units, not a typeface
      requirement.
    verbatim: >-
      5b: "Use 1.5 line spacing and 1\" margins on all sides. Do not use multiple columns."
    check: layout_packages
    note: >-
      Spacing, margins and single-column all PASS. Typeface is FREE, so newtxtext is a choice,
      not a compliance item. ONE THING THE BOOK DOES NOT SETTLE: the rule says "1.5 line
      spacing" without defining it, and the manuscript header at :8-12 records that
      \onehalfspacing is Word-style 1.5 (baselinestretch ~1.24) rather than a literal 1.5.
      The book does not adjudicate. Measuring a rendered page remains the only way to decide,
      and there is no TeX toolchain here.

