    source: "corpus, stated twice"
    status: confirmed
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rules 4a, 4b, 4e"
    verbatim: >-
      4a: "The paper should be 20 pages or less. There is no page minimum. Pages of content
      beyond page 20 (excluding the pages mentioned below) will not be read or considered."
      4b: "Include a title page as the first page, abstract as the second page and a bibliography
      at the end of the Research Report. The title page, abstract and bibliography do not count
      toward the 20-page limit." 4e: "Appendices count toward the 20-page limit. Some students
      choose to include all images, charts, data, etc. within the paper, while others place them
      in appendices. Both options are acceptable."
    check: page_count
    note: >-
      CONFIRMED exactly as recorded. The exclusions are worth 1.48 pp on the current manuscript
      (title 0.22 + abstract 0.47 + bibliography 0.79); notes/writing-guide.md section 6.2
