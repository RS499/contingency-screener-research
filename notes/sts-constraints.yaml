  - id: R03
    rule: "Sole-authored individual research; no team projects, no splitting a team project"
    source: "corpus"
    status: confirmed
    date_checked: "2026-08-27"
    rule_ref: "RULES2027 p.6, AM I ELIGIBLE? section 4, TYPE OF RESEARCH"
    verbatim: >-
      "Applicants must complete individual research projects to enter Regeneron STS. Research
      conducted as part of a pre-collegiate student team project is not eligible for Regeneron
      STS. ... Students may not 'split' a team project and enter as individuals. ... Students
      who have been part of a team project wishing to continue as an individual may only submit
      the work completed independently and may not submit any work completed with the teammates.
      Research conducted alongside adult researchers in a research institution is permitted, but
      clarity and adequate knowledge of an individual's role and independence vs. work being done
      by the collective laboratory throughout the application is vital. Students should take
      credit only for their portion of the lab's work."
    check: null
    note: >-
      CONFIRMED, and the Master Plan 3.3 question is now PARTLY ANSWERED. The prohibition is on
      pre-collegiate STUDENT team projects (4a, 4a.i, 4a.ii). Research alongside ADULT
      researchers is explicitly PERMITTED (4a.iii), conditioned on clarity about the
      individual's role. WHICH CLAUSE GOVERNS THE URTC CO-AUTHORSHIP DEPENDS ON WHETHER THOSE
      CO-AUTHORS ARE STUDENTS OR ADULTS - a fact NOT RECORDED IN THIS REPOSITORY and not
      guessed here. Same page 4b: "Continuation research projects and research completed over
      any length of time in any year of school are eligible."

  - id: R04
    rule: "Report written by the student WITHOUT generative AI; research use permitted and disclosable"
    source: "2027 guidelines"
    status: corrected
    date_checked: "2026-08-27"
    rule_ref: "GUIDE2027 rule 1; RULES2027 Appendix 4 p.34, ACCEPTABLE AI USAGE CHART"
    superseded_text: >-
      "Report written by the student WITHOUT generative AI; research use permitted and
      disclosable" - materially INCOMPLETE. It records the prohibition but omits every
      operative condition attached to the permitted uses, so the file understated what the
      project must actually produce.
    verbatim: >-
      GUIDE2027 rule 1: "The Student Researcher is required to write the paper without the use
      of generative AI (ChatGPT or other programs)." RULES2027 Appendix 4 is a 13-row graded
      table, NOT a blanket ban. NEVER ACCEPTABLE: using AI to initially write the research plan,
      abstract, paper or poster ("This must be the independent work of the student"); asking AI
      to write an abstract or section and submitting as your own work; using AI to produce
      conclusions or future steps; asking AI for a starter bibliography. PERMITTED WITH
      CONDITIONS: "Use AI to write initial code for your project - Yes - Acceptable, only with
      explicit citation stating which portions of the code were AI generated and with a log of
      the prompts."; "Use an AI chatbot as a writing tool to help generate and develop ideas -
      Yes - ... Maintain a logbook of your prompts as part of your research notebook."; "Use AI
      to help identify appropriate statistical tests or software tools ... requires a log of your
      prompts"; "You write an abstract. Ask AI to sharpen the language but not modify, add to, or
      replace the main points - Yes - Acceptable use without explicit citation only if changes
      suggested by AI are minor and limited to grammar and syntax. Must be credited."
    check: authorship_boundary
    note: >-
      Enforced mechanically from 2026-08-18 by .claude/hooks/guard_report_prose.sh and
      .claude/hooks/guard_report_bash.sh. TWO CONDITIONS, ONE MET AND ONE NOT. The prompt-log
      condition is MET: notes/ai-prompt-log.md is the required logbook and predates this
      finding. The code-portion condition is NOT MET: the Acknowledgments at
      report/paper_current_STS.tex:287 says AI "was used to validate the code and grammar" but
      names no portion. Recorded as erratum E3. The Master Plan 3.3 question about AI-resolved
      citations is NOT settled by Appendix 4; the nearest row is the starter-bibliography row,
      which is Never acceptable, while "fix the structure or formatting of your bibliography"
      is acceptable. Independently verified resolution of a citation the student found is
      neither row. STILL AN ASK.

  - id: R05
